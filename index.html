<!DOCTYPE html>

    body{
      font-family: Arial;
      background:#f4f4f4;
      margin:0;
      padding:20px;
      direction:rtl;
      text-align:center;
    }

    h1{
      color:#222;
      margin-bottom:20px;
    }

    .container{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
    }

    .card{
      background:white;
      width:280px;
      padding:15px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
    }

    .price{
      color:green;
      font-weight:bold;
      margin:10px 0;
    }

    a button{
      background:green;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }
  </style>
</head>
