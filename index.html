<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب السفر</title>

  <style>
    body{
      font-family: Arial;
      background:#f4f4f4;
      margin:0;
      padding:20px;
      direction:rtl;
      text-align:center;
    }

    h1{
      margin-bottom:10px;
    }

    /* أدوات التحكم */
    .controls{
      margin-bottom:15px;
    }

    select{
      padding:10px;
      border-radius:10px;
      font-size:16px;
      border:1px solid #ccc;
      cursor:pointer;
    }

    input{
      width:90%;
      max-width:400px;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-bottom:15px;
      font-size:16px;
    }

    .container{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
    }

    .card{
      background:white;
      width:280px;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
    }

    .card img{
      width:100%;
      height:160px;
      object-fit:cover;
    }

    .content{
      padding:15px;
    }

    .price{
      color:green;
      font-weight:bold;
      margin:10px 0;
    }

    a button{
      background:green;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }
  </style>
</head>

<body>

<h1>✈️ رحلات مكتب السفر</h1>

<!-- البحث -->
<input type="text" id="search" placeholder="ابحث عن رحلة">

<!-- الترتيب -->
<div class="controls">
  <select id="sort">
    <option value="default">ترتيب الرحلات</option>
    <option value="priceLow">السعر: من الأرخص للأغلى</option>
    <option value="priceHigh">السعر: من الأغلى للأرخص</option>
    <option value="name">حسب الاسم</option>
  </select>
</div>

<div class="container" id="cards">

  <div class="card" data-price="250" data-name="مشهد">
    <img src="IMG-20260524-WA0000.jpg" />
    <div class="content">
      <h2>بغداد → مشهد</h2>
      <p class="price">250$</p>
      <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى مشهد">
        <button>احجز عبر واتساب</button>
      </a>
    </div>
  </div>

  <div class="card" data-price="300" data-name="إسطنبول">
    <img src="https://source.unsplash.com/600x400/?istanbul" />
    <div class="content">
      <h2>بغداد → إسطنبول</h2>
      <p class="price">300$</p>
      <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى إسطنبول">
        <button>احجز عبر واتساب</button>
      </a>
    </div>
  </div>

  <div class="card" data-price="280" data-name="دبي">
    <img src="https://source.unsplash.com/600x400/?dubai" />
    <div class="content">
      <h2>بغداد → دبي</h2>
      <p class="price">280$</p>
      <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى دبي">
        <button>احجز عبر واتساب</button>
      </a>
    </div>
  </div>

</div>

<script>
const search = document.getElementById("search");
const sort = document.getElementById("sort");
const container = document.getElementById("cards");

let cards = Array.from(document.querySelectorAll(".card"));

/* 🔍 البحث */
search.addEventListener("input", function(){
  let value = this.value.toLowerCase();

  cards.forEach(card => {
    let text = card.innerText.toLowerCase();
    card.style.display = text.includes(value) ? "block" : "none";
  });
});

/* 🔃 الترتيب */
sort.addEventListener("change", function(){

  let value = this.value;

  if(value === "priceLow"){
    cards.sort((a,b) => a.dataset.price - b.dataset.price);
  }

  else if(value === "priceHigh"){
    cards.sort((a,b) => b.dataset.price - a.dataset.price);
  }

  else if(value === "name"){
    cards.sort((a,b) => a.dataset.name.localeCompare(b.dataset.name, 'ar'));
  }

  else{
    return;
  }

  container.innerHTML = "";
  cards.forEach(card => container.appendChild(card));
});
</script>

</body>
</html>
