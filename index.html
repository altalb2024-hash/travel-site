<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب السفر</title>

  <style>
    body{
      font-family: Arial;
      background:#f4f4f4;
      margin:0;
      padding:20px;
      direction:rtl;
      text-align:center;
    }

    h1{
      margin-bottom:10px;
    }

    /* مربع البحث */
    input{
      width:90%;
      max-width:400px;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-bottom:20px;
      font-size:16px;
    }

    .container{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
    }

    .card{
      background:white;
      width:280px;
      padding:15px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
    }

    .price{
      color:green;
      font-weight:bold;
      margin:10px 0;
    }

    a button{
      background:green;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body>

<h1>✈️ رحلات مكتب السفر</h1>

<!-- مربع البحث -->
<input type="text" id="search" placeholder="ابحث عن رحلة (مثلاً: إسطنبول)">

<div class="container" id="cards">

  <!-- رحلة 1 -->
  <div class="card">
    <h2>بغداد → مشهد</h2>
    <p class="price">250$</p>
    <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى مشهد">
      <button>احجز عبر واتساب</button>
    </a>
  </div>

  <!-- رحلة 2 -->
  <div class="card">
    <h2>بغداد → إسطنبول</h2>
    <p class="price">300$</p>
    <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى إسطنبول">
      <button>احجز عبر واتساب</button>
    </a>
  </div>

  <!-- رحلة 3 -->
  <div class="card">
    <h2>بغداد → دبي</h2>
    <p class="price">280$</p>
    <a href="https://wa.me/9647XXXXXXXXX?text=أريد حجز رحلة بغداد إلى دبي">
      <button>احجز عبر واتساب</button>
    </a>
  </div>

</div>

<script>
  const search = document.getElementById("search");
  const cards = document.querySelectorAll(".card");

  search.addEventListener("input", function(){
    let value = this.value.toLowerCase();

    cards.forEach(card => {
      let text = card.innerText.toLowerCase();

      if(text.includes(value)){
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
